  <g transform="translate(105 242)"><text fill="#94465d" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">A CLEARER WAY TO MANAGE CREDIT</text><text y="87" fill="#43302e" font-family="Georgia,serif" font-size="72" font-weight="700">Your card,</text><text y="159" fill="#94465d" font-family="Georgia,serif" font-size="72" font-weight="700">Your control,</text><text y="231" fill="#43302e" font-family="Georgia,serif" font-size="72" font-weight="700">Your vault.</text><text y="286" fill="#43302e" font-family="Georgia,serif" font-size="25">Every piece of your credit life in one picture.</text><text y="326" fill="#695957" font-family="Arial,sans-serif" font-size="16">Cards, purchases, payments, statements and credit health</text><text y="350" fill="#695957" font-family="Arial,sans-serif" font-size="16">together in one secure, simple place.</text><rect y="389" width="100" height="44" rx="7" fill="#43302e"/><text x="29" y="417" fill="#fffdf7" font-family="Arial,sans-serif" font-size="14" font-weight="700">APPLY</text><rect x="114" y="389" width="174" height="44" rx="7" fill="#fffdf7" stroke="#43302e"/><text x="139" y="417" fill="#43302e" font-family="Arial,sans-serif" font-size="14" font-weight="700">LOGIN AS CUSTOMER</text></g>
